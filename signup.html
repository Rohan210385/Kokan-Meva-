
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - KokanMewa</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #25160c, #a64b0b, #ed9b36);
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .signup-box h1 {
            text-align: center;
            color: #a64b0b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d97716;
            box-shadow: 0 0 5px #e8a45b;
        }

        .signup-btn, .reset-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .signup-btn {
            background: #a64b0b;
            color: white;
        }

        .signup-btn:hover {
            background: black;
        }

        .reset-btn {
            background: #eee;
            color: #333;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
        }

        .login-link a {
            color: #a64b0b;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>

    <script>
        function signup(e) {
            e.preventDefault();

            let username = document.getElementById("username").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Password and Confirm Password do not match!");
                return;
            }

            let users = JSON.parse(
                localStorage.getItem("registerusers")
            ) || [];

            let existingUser = users.find(function(user) {
                return user.useremail.toLowerCase() === email.toLowerCase();
            });

            if (existingUser) {
                alert("Email already registered!");
                return;
            }

            const user = {
                username: username,
                useremail: email,
                userpassword: password,
                userconfirmPassword: confirmPassword
            };

            users.push(user);

            localStorage.setItem(
                "registerusers",
                JSON.stringify(users)
            );

            alert("Registration successful!");

            window.location.href = "login1.html";
        }
    </script>
</head>

<body>

    <div class="signup-box">

        <h1>KokanMewa</h1>
        <p class="subtitle">Create Your New Account</p>

        <form onsubmit="signup(event)">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       placeholder="Enter your name"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       placeholder="Enter password"
                       pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,8}$"
                       title="Use uppercase, number, special character and 6 to 8 characters."
                       required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm your password"
                       required>
            </div>

            <button type="submit" class="signup-btn">
                Sign Up
            </button>

            <button type="reset" class="reset-btn">
                Reset
            </button>

            <div class="login-link">
                Already have an account?
                <a href="login1.html">Login</a>
            </div>

        </form>

    </div>

</body>
</html>
